<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bordadoras de Yucatán — Mapa Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link
        id="leaflet-css-primary"
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        onerror="loadFallbackLeafletCSS()"
    />
    <style>
        /* ==================== ESTILOS BASE Y DISEÑO DE DIRECTORIO ==================== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #f3f4f6;
            color: #1f2937;
            overflow-x: hidden;
        }

        /* Contenedor amplio sin márgenes laterales que achiquen el mapa */
        .page-shell {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 10px 12px;
        }

        /* Distribución pegada sin huecos grandes: mapa amplio a la izquierda, submenú compacto y menú a la derecha */
        .main-layout {
            display: flex;
            align-items: stretch;
            gap: 0;
            width: 100%;
        }

        .map-column {
            flex: 1 1 auto;
            min-width: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .map-frame-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            min-height: 500px;
            background-color: #dbeafe;
            border: 1px solid #d1d5db;
            border-radius: 4px 0 0 4px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .main-layout.submenu-open .map-frame-wrapper {
            border-radius: 4px 0 0 4px;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 500px;
            z-index: 1;
            background-color: #dbeafe;
        }

        /* Ocultar la atribución inferior de Leaflet */
        .leaflet-control-attribution {
            display: none !important;
        }

        /* Respaldo SVG local si fallan los mosaicos o la librería */
        .svg-fallback-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: none;
            background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 100%);
        }

        .svg-fallback-layer.active {
            display: block;
        }

        /* ==================== MARCADORES TIPO PIN CON ÍCONO SVG (SIN PUNTOS) ==================== */
        .pin-marker-container {
            background: transparent;
            border: none;
        }

        .pin-teardrop {
            width: 34px;
            height: 34px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
            box-shadow: 0 3px 8px rgba(15, 23, 42, 0.35);
            transition: transform 0.15s ease;
        }

        .pin-teardrop:hover {
            transform: rotate(-45deg) scale(1.12);
        }

        .pin-teardrop-inner {
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        /* ==================== BARRA INFERIOR DE CAPA BASE Y CENTRADO ==================== */
        .bottom-controls-bar {
            margin-top: 8px;
            padding: 9px 12px;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .basemap-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .basemap-label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-right: 4px;
        }

        .basemap-btn {
            padding: 5px 11px;
            font-size: 12.5px;
            font-weight: 500;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            color: #374151;
            cursor: pointer;
            transition: background-color 0.14s ease, color 0.14s ease;
        }

        .basemap-btn:hover {
            background-color: #f3f4f6;
        }

        .basemap-btn.active {
            background-color: #374151;
            border-color: #374151;
            color: #ffffff;
        }

        .right-map-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .visible-count-text {
            font-size: 13px;
            color: #374151;
            font-weight: 500;
        }

        .center-yucatan-btn {
            padding: 6px 13px;
            font-size: 12.5px;
            font-weight: 600;
            color: #b91c1c;
            background-color: #fff5f5;
            border: 1px solid #fca5a5;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.14s ease, color 0.14s ease;
        }

        .center-yucatan-btn:hover {
            background-color: #fee2e2;
            color: #991b1b;
        }

        /* ==================== SUBMENÚ DESPLEGABLE COMPACTO PEGADO AL MAPA ==================== */
        .side-submenu-column {
            width: 0;
            min-width: 0;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.18s ease, min-width 0.18s ease;
        }

        .side-submenu-column.open {
            width: 235px;
            min-width: 235px;
        }

        .detached-submenu-panel {
            width: 235px;
            height: 600px;
            min-height: 500px;
            background-color: #ffffff;
            border-top: 1px solid #d1d5db;
            border-bottom: 1px solid #d1d5db;
            border-right: 1px solid #e5e7eb;
            border-left: none;
            border-radius: 0;
            box-shadow: inset 2px 0 6px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .submenu-header {
            padding: 10px 10px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .submenu-header-left {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .submenu-swatch {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .submenu-heading {
            margin: 0;
            font-size: 12.5px;
            font-weight: 700;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .submenu-close-btn {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #475569;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .submenu-close-btn:hover {
            background-color: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
        }

        .submenu-items-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .submenu-workshop-btn {
            width: 100%;
            text-align: left;
            padding: 8px 9px;
            border: 1px solid transparent;
            border-radius: 5px;
            background-color: transparent;
            cursor: pointer;
            display: block;
            transition: background-color 0.14s ease, border-color 0.14s ease;
        }

        .submenu-workshop-btn + .submenu-workshop-btn {
            margin-top: 4px;
        }

        .submenu-workshop-btn:hover {
            background-color: #fef2f2;
            border-color: #fecaca;
        }

        .submenu-workshop-title {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #111827;
            line-height: 1.3;
        }

        .submenu-workshop-meta {
            display: block;
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
            line-height: 1.25;
        }

        /* ==================== PANEL DERECHO DE BORDADORAS PEGADO AL MAPA / SUBMENÚ ==================== */
        .directory-column {
            width: 280px;
            min-width: 280px;
            flex-shrink: 0;
            position: relative;
        }

        .directory-card {
            width: 100%;
            height: 600px;
            min-height: 500px;
            background-color: #ffffff;
            border-top: 1px solid #d1d5db;
            border-right: 1px solid #d1d5db;
            border-bottom: 1px solid #d1d5db;
            border-left: none;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow-y: auto;
        }

        .directory-header {
            position: relative;
            background-color: #e5e7eb;
            padding: 13px 54px 13px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid #ffffff;
            border-top-right-radius: 4px;
        }

        .directory-header:hover {
            background-color: #dfe3e8;
        }

        .directory-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #4b5563;
            line-height: 1.25;
        }

        .directory-caret {
            font-size: 12px;
            color: #4b5563;
            transition: transform 0.2s ease;
        }

        .directory-header.collapsed .directory-caret {
            transform: rotate(-90deg);
        }

        .pin-corner-tab {
            position: absolute;
            top: 0;
            right: 10px;
            width: 36px;
            height: 46px;
            background-color: #ffffff;
            clip-path: polygon(0 0, 100% 0, 100% 76%, 50% 100%, 0 76%);
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.14));
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8px;
            pointer-events: none;
        }

        .directory-body {
            display: block;
        }

        .directory-body.collapsed {
            display: none;
        }

        .directory-search-box {
            padding: 9px;
            background-color: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .directory-search-input {
            width: 100%;
            padding: 7px 9px;
            font-size: 12.5px;
            color: #374151;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            outline: none;
        }

        .directory-search-input:focus {
            border-color: #6b7280;
        }

        .category-row-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0;
            border: none;
            border-bottom: 1px solid #ffffff;
            background-color: #f3f4f6;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.14s ease;
        }

        .category-row-btn:last-child {
            border-bottom: none;
        }

        .category-row-btn:hover {
            background-color: #e5e7eb;
        }

        .category-row-btn.active {
            background-color: #e2e8f0;
        }

        .category-row-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .category-icon-box {
            width: 42px;
            height: 44px;
            min-width: 42px;
            background-color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.14s ease;
        }

        .category-row-btn.active .category-icon-box {
            background-color: #b91c1c;
        }

        .category-row-label {
            font-size: 13px;
            color: #4b5563;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-row-btn.active .category-row-label {
            color: #111827;
            font-weight: 600;
        }

        .category-row-right {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-right: 10px;
        }

        .category-count-pill {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            padding: 1px 6px;
            border-radius: 999px;
        }

        .category-row-caret {
            font-size: 11px;
            color: #4b5563;
        }

        /* ==================== MODAL DE DETALLE ==================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-color: rgba(15, 23, 42, 0.55);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .toast-banner {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            background-color: #111827;
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .toast-banner.show {
            opacity: 1;
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
                gap: 8px;
            }

            .map-frame-wrapper {
                height: 440px;
                min-height: 380px;
                border-radius: 4px;
            }

            .side-submenu-column.open {
                width: 100%;
                min-width: 0;
            }

            .detached-submenu-panel {
                width: 100%;
                height: auto;
                min-height: 0;
                max-height: 240px;
                border: 1px solid #cbd5e1;
                border-radius: 4px;
            }

            .directory-column {
                width: 100%;
                min-width: 0;
            }

            .directory-card {
                height: auto;
                min-height: 0;
                border: 1px solid #d1d5db;
                border-radius: 4px;
            }
        }
    </style>
</head>
<body>
    <div id="toastBanner" class="toast-banner" role="status" aria-live="polite"></div>

    <div class="page-shell">
        <div id="mainLayout" class="main-layout">
            <!-- Columna izquierda: Mapa amplio pegado al menú + Barra inferior -->
            <div class="map-column">
                <div class="map-frame-wrapper">
                    <div id="map" role="region" aria-label="Mapa interactivo de bordadoras y talleres de Yucatán"></div>

                    <!-- Respaldo SVG local de Yucatán con pines si los mosaicos tardan o fallan -->
                    <div id="svgFallbackLayer" class="svg-fallback-layer" aria-hidden="true">
                        <svg id="yucatanSvgFallback" viewBox="0 0 800 520" class="w-full h-full">
                            <rect x="0" y="0" width="800" height="520" fill="#dbeafe"></rect>
                            <polygon
                                points="125,155 265,95 480,82 670,96 685,155 645,380 420,405 215,365 140,255"
                                fill="#fefce8"
                                stroke="#991b1b"
                                stroke-width="2.5"
                            ></polygon>
                            <text x="415" y="238" text-anchor="middle" fill="#475569" font-size="18" font-weight="700">
                                Estado de Yucatán · Mapa Local
                            </text>
                            <g id="fallbackPinsGroup"></g>
                        </svg>
                    </div>
                </div>

                <!-- Barra inferior: Capa base + Marcas visibles + Centrar en Yucatán -->
                <div class="bottom-controls-bar">
                    <div class="basemap-group" role="group" aria-label="Capa base del mapa">
                        <span class="basemap-label">Capa base:</span>
                        <button type="button" data-basemap="osm" class="basemap-btn active">Estándar</button>
                        <button type="button" data-basemap="satelite" class="basemap-btn">Satélite</button>
                    </div>

                    <div class="right-map-meta">
                        <span id="visibleMarksCounter" class="visible-count-text">Marcas visibles: 0</span>
                        <button id="centerYucatanBtn" type="button" class="center-yucatan-btn">
                            Centrar en Yucatán
                        </button>
                    </div>
                </div>
            </div>

            <!-- Columna compacta a un lado del mapa: Submenú desplegable pegado al borde -->
            <div id="sideSubmenuColumn" class="side-submenu-column">
                <aside id="detachedSubmenuPanel" class="detached-submenu-panel" aria-label="Talleres de la categoría seleccionada">
                    <div class="submenu-header">
                        <div class="submenu-header-left">
                            <span id="submenuSwatch" class="submenu-swatch" style="background-color:#b91c1c;"></span>
                            <h2 id="submenuHeading" class="submenu-heading">Categoría</h2>
                        </div>
                        <button id="closeDetachedSubmenuBtn" type="button" class="submenu-close-btn" title="Cerrar submenú" aria-label="Cerrar submenú">
                            &times;
                        </button>
                    </div>
                    <div id="submenuWorkshopList" class="submenu-items-scroll"></div>
                </aside>
            </div>

            <!-- Columna derecha: Directorio de bordadoras pegado directamente al mapa/submenú -->
            <div class="directory-column">
                <section class="directory-card" aria-label="Directorio de bordadoras de Yucatán">
                    <div id="directoryHeaderToggle" class="directory-header" role="button" tabindex="0" aria-expanded="true">
                        <h1 class="directory-title">Bordadoras de Yucatán</h1>
                        <span id="directoryHeaderCaret" class="directory-caret">&#9660;</span>

                        <div class="pin-corner-tab" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#9ca3af">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                            </svg>
                        </div>
                    </div>

                    <div id="directoryBody" class="directory-body">
                        <div class="directory-search-box">
                            <input
                                id="directorySearchInput"
                                class="directory-search-input"
                                type="text"
                                placeholder="Buscar taller, bordadora o municipio..."
                                autocomplete="off"
                            />
                        </div>
                        <div id="categoriesRowsContainer"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Modal de detalle completo del taller y ruta -->
    <div id="workshopDetailModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalWorkshopName">
        <div class="bg-white border border-gray-200 rounded-lg shadow-2xl max-w-md w-full overflow-hidden">
            <div id="modalHeaderBar" class="px-4 py-3.5 bg-red-800 text-white flex items-start justify-between gap-2">
                <div>
                    <span id="modalCategoryPill" class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white/20 mb-1">Categoría</span>
                    <h3 id="modalWorkshopName" class="text-base font-bold leading-snug">Taller</h3>
                    <p id="modalMunicipalitySub" class="text-xs text-white/90">Municipio, Yucatán</p>
                </div>
                <button id="closeWorkshopModalBtn" type="button" class="w-7 h-7 rounded bg-white/15 hover:bg-white/25 text-white text-sm font-bold cursor-pointer">
                    &times;
                </button>
            </div>
            <div class="p-4 space-y-3 text-xs text-gray-700">
                <p id="modalWorkshopDesc" class="text-sm text-gray-600 leading-relaxed"></p>
                <div class="bg-gray-50 border border-gray-200 rounded p-3 space-y-1.5">
                    <div><strong>Bordadora / Taller:</strong> <span id="modalArtisanDetail"></span></div>
                    <div><strong>Especialidad:</strong> <span id="modalSpecialtyDetail"></span></div>
                    <div><strong>Horario:</strong> <span id="modalScheduleDetail"></span></div>
                    <div><strong>Coordenadas:</strong> <span id="modalCoordsDetail" class="font-mono"></span></div>
                </div>
                <div class="flex items-center justify-end gap-2 pt-1">
                    <button id="modalCenterPinBtn" type="button" class="px-3 py-1.5 rounded border border-gray-300 hover:bg-gray-100 text-gray-700 font-semibold cursor-pointer">
                        Ubicar en mapa
                    </button>
                    <a id="modalRouteExternalLink" href="#" target="_blank" rel="noopener noreferrer" class="px-3.5 py-1.5 rounded bg-red-800 hover:bg-red-900 text-white font-semibold">
                        Ver ruta
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Respaldo automático de CSS y JS de Leaflet -->
    <script>
        function loadFallbackLeafletCSS() {
            if (document.getElementById("leaflet-css-fallback")) return;
            const link = document.createElement("link");
            link.id = "leaflet-css-fallback";
            link.rel = "stylesheet";
            link.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css";
            document.head.appendChild(link);
        }

        function ensureLeafletReady(onReady) {
            let resolved = false;
            const finish = () => {
                if (!resolved) {
                    resolved = true;
                    onReady();
                }
            };

            if (typeof window.L !== "undefined" && typeof window.L.map === "function") {
                finish();
                return;
            }

            const s1 = document.createElement("script");
            s1.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
            s1.onload = () => {
                if (typeof window.L !== "undefined" && typeof window.L.map === "function") {
                    finish();
                } else {
                    loadCdnjsLeaflet();
                }
            };
            s1.onerror = loadCdnjsLeaflet;

            function loadCdnjsLeaflet() {
                if (typeof window.L !== "undefined" && typeof window.L.map === "function") {
                    finish();
                    return;
                }
                const s2 = document.createElement("script");
                s2.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
                s2.onload = finish;
                s2.onerror = finish;
                document.head.appendChild(s2);
            }

            document.head.appendChild(s1);
            setTimeout(finish, 3000);
        }
    </script>

    <script>
        /**
         * =========================================================================
         * DATOS EXCLUSIVOS DE BORDADORAS Y TALLERES DEL ESTADO DE YUCATÁN
         * =========================================================================
         */
        const DATA_BORDADORAS_YUCATAN = [
            {
                id: "punto_cruz_yucateco",

        const YUCATAN_CENTER = [20.75, -89.05];
        const YUCATAN_ZOOM = 8;

        // Estado de la aplicación
        let activeCategoryId = null;
        let searchQuery = "";
        let isDirectoryExpanded = true;
        let isSubmenuOpen = false;
        let usingSvgFallback = false;
        let selectedWorkshopPair = null;

        let map = null;
        let baseLayers = {};
        let pinsLayerGroup = null;
        let pinMarkersById = {};

        function showToastMessage(msg) {
            const toast = document.getElementById("toastBanner");
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add("show");
            clearTimeout(showToastMessage._timer);
            showToastMessage._timer = setTimeout(() => toast.classList.remove("show"), 2000);
        }

        function forceMapResize() {
            if (map) {
                try {
                    map.invalidateSize({ animate: false });
                } catch (err) {
                    // Sin acción si aún inicializa
                }
            }
        }

        function matchesQuery(cat, item) {
            const q = searchQuery.trim().toLowerCase();
            if (!q) return true;
            return (
                item.name.toLowerCase().includes(q) ||
                item.municipality.toLowerCase().includes(q) ||
                item.artisan.toLowerCase().includes(q) ||
                item.specialty.toLowerCase().includes(q) ||
                cat.label.toLowerCase().includes(q)
            );
        }

        function getActivePairs() {
            const q = searchQuery.trim().toLowerCase();
            const pairs = [];

            DATA_BORDADORAS_YUCATAN.forEach(cat => {
                if (activeCategoryId && cat.id !== activeCategoryId) return;
                if (!activeCategoryId && !q) return;

                cat.items.forEach(item => {
                    if (matchesQuery(cat, item)) {
                        pairs.push({ cat, item });
                    }
                });
            });

            return pairs;
        }

        function projectToFallbackSvg(lat, lng) {
            const minLng = -90.65, maxLng = -87.35;
            const minLat = 19.45, maxLat = 21.75;
            const x = ((lng - minLng) / (maxLng - minLng)) * 620 + 90;
            const y = ((maxLat - lat) / (maxLat - minLat)) * 410 + 55;
            return { x, y };
        }

        function renderFallbackPins(pairs) {
            const group = document.getElementById("fallbackPinsGroup");
            if (!group) return;
            group.innerHTML = "";

            pairs.forEach(({ cat, item }) => {
                const pt = projectToFallbackSvg(item.lat, item.lng);
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.style.cursor = "pointer";
                g.innerHTML = `
                    <path d="M${pt.x} ${pt.y} C${pt.x - 11} ${pt.y - 12}, ${pt.x - 11} ${pt.y - 28}, ${pt.x} ${pt.y - 28} C${pt.x + 11} ${pt.y - 28}, ${pt.x + 11} ${pt.y - 12}, ${pt.x} ${pt.y} Z" fill="${cat.color}" stroke="#ffffff" stroke-width="2"></path>
                    <circle cx="${pt.x}" cy="${pt.y - 18}" r="4" fill="#ffffff"></circle>
                    <text x="${pt.x + 12}" y="${pt.y - 14}" font-size="11.5" font-weight="700" fill="#0f172a">${item.name}</text>
                `;
                g.addEventListener("click", () => openWorkshopModal(cat, item));
                group.appendChild(g);
            });
        }

        function renderPinsOnMap(shouldFit = false) {
            const pairs = getActivePairs();
            const counterEl = document.getElementById("visibleMarksCounter");
            if (counterEl) {
                counterEl.textContent = `Marcas visibles: ${pairs.length}`;
            }

            if (usingSvgFallback) {
                renderFallbackPins(pairs);
                return;
            }

            if (!map || !pinsLayerGroup) return;
            pinsLayerGroup.clearLayers();
            pinMarkersById = {};

            const bounds = [];

            pairs.forEach(({ cat, item }) => {
                // Marcador tipo pin con ícono SVG (nunca punto circular)
                const pinIcon = L.divIcon({
                    className: "pin-marker-container",
                    html: `
                        <div class="pin-teardrop" style="background-color:${cat.color};">
                            <div class="pin-teardrop-inner">${cat.iconSvg}</div>
                        </div>
                    `,
                    iconSize: [34, 34],
                    iconAnchor: [17, 34],
                    popupAnchor: [0, -32]
                });

                const marker = L.marker([item.lat, item.lng], {
                    icon: pinIcon,
                    title: `${item.name} · ${item.municipality}, Yucatán`
                });

                marker.bindPopup(`
                    <div style="min-width:190px;max-width:240px;">
                        <div style="font-size:11px;font-weight:700;color:${cat.color};margin-bottom:2px;">${cat.label}</div>
                        <div style="font-size:13px;font-weight:700;color:#111827;margin-bottom:2px;">${item.name}</div>
                        <div style="font-size:11.5px;color:#6b7280;margin-bottom:6px;">${item.municipality}, Yucatán · ${item.artisan}</div>
                        <button
                            type="button"
                            onclick="window.openWorkshopById('${item.id}')"
                            style="padding:5px 10px;border:none;border-radius:4px;background:${cat.color};color:#fff;font-size:11.5px;font-weight:600;cursor:pointer;"
                        >
                            Ver detalle
                        </button>
                    </div>
                `);

                marker.addTo(pinsLayerGroup);
                pinMarkersById[item.id] = marker;
                bounds.push([item.lat, item.lng]);
            });

            if (shouldFit && bounds.length > 0) {
                if (bounds.length === 1) {
                    map.setView(bounds[0], 11, { animate: true });
                } else {
                    map.fitBounds(bounds, { padding: [55, 55], maxZoom: 11 });
                }
            }

            setTimeout(forceMapResize, 60);
        }

        function handleCategoryClick(catId) {
            if (activeCategoryId === catId) {
                // Segundo clic en la misma categoría: contrae y limpia la selección
                activeCategoryId = null;
                isSubmenuOpen = false;
                showToastMessage("Categoría contraída");
            } else {
                // Primer clic: marca los talleres de la categoría en el mapa y despliega el submenú a un lado del mapa
                activeCategoryId = catId;
                isSubmenuOpen = true;
                const found = DATA_BORDADORAS_YUCATAN.find(c => c.id === catId);
                if (found) showToastMessage(`Marcando: ${found.label}`);
            }

            renderCategoriesRows();
            renderDetachedSubmenu();
            renderPinsOnMap(Boolean(activeCategoryId));
            setTimeout(forceMapResize, 190);
        }

        function renderCategoriesRows() {
            const container = document.getElementById("categoriesRowsContainer");
            if (!container) return;
            container.innerHTML = "";

            const q = searchQuery.trim().toLowerCase();

            DATA_BORDADORAS_YUCATAN.forEach(cat => {
                const matches = cat.items.filter(item => matchesQuery(cat, item));
                if (q && matches.length === 0) return;

                const isSelected = activeCategoryId === cat.id;

                const rowBtn = document.createElement("button");
                rowBtn.type = "button";
                rowBtn.className = `category-row-btn ${isSelected ? "active" : ""}`;
                rowBtn.setAttribute("aria-expanded", isSelected ? "true" : "false");
                rowBtn.innerHTML = `
                    <span class="category-row-left">
                        <span class="category-icon-box">${cat.iconSvg}</span>
                        <span class="category-row-label">${cat.label}</span>
                    </span>
                    <span class="category-row-right">
                        <span class="category-count-pill">${matches.length}</span>
                        <span class="category-row-caret">${isSelected ? "&#9652;" : "&#9662;"}</span>
                    </span>
                `;

                rowBtn.addEventListener("click", () => handleCategoryClick(cat.id));
                container.appendChild(rowBtn);
            });
        }

        function renderDetachedSubmenu() {
            const layoutEl = document.getElementById("mainLayout");
            const colEl = document.getElementById("sideSubmenuColumn");
            const panel = document.getElementById("detachedSubmenuPanel");
            const listEl = document.getElementById("submenuWorkshopList");
            const headingEl = document.getElementById("submenuHeading");
            const swatchEl = document.getElementById("submenuSwatch");
            if (!layoutEl || !colEl || !panel || !listEl || !headingEl || !swatchEl) return;

            if (!activeCategoryId || !isSubmenuOpen) {
                colEl.classList.remove("open");
                layoutEl.classList.remove("submenu-open");
                return;
            }

            const cat = DATA_BORDADORAS_YUCATAN.find(c => c.id === activeCategoryId);
            if (!cat) {
                colEl.classList.remove("open");
                layoutEl.classList.remove("submenu-open");
                return;
            }

            const matches = cat.items.filter(item => matchesQuery(cat, item));
            headingEl.textContent = `${cat.label} (${matches.length})`;
            swatchEl.style.backgroundColor = cat.color;
            listEl.innerHTML = "";

            matches.forEach(item => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "submenu-workshop-btn";
                btn.innerHTML = `
                    <span class="submenu-workshop-title">${item.name}</span>
                    <span class="submenu-workshop-meta">${item.municipality}, Yucatán &bull; ${item.artisan}</span>
                `;
                btn.addEventListener("click", () => {
                    selectWorkshopAndOpenModal(cat, item);
                });
                listEl.appendChild(btn);
            });

            colEl.classList.add("open");
            layoutEl.classList.add("submenu-open");
        }

        function selectWorkshopAndOpenModal(cat, item) {
            if (!usingSvgFallback && map) {
                map.setView([item.lat, item.lng], 12, { animate: true });
                const marker = pinMarkersById[item.id];
                if (marker) {
                    setTimeout(() => marker.openPopup(), 200);
                }
            }
            openWorkshopModal(cat, item);
        }

        function openWorkshopModal(cat, item) {
            selectedWorkshopPair = { cat, item };
            const modal = document.getElementById("workshopDetailModal");
            document.getElementById("modalHeaderBar").style.backgroundColor = cat.color;
            document.getElementById("modalCategoryPill").textContent = cat.label;
            document.getElementById("modalWorkshopName").textContent = item.name;
            document.getElementById("modalMunicipalitySub").textContent = `${item.municipality}, Estado de Yucatán`;
            document.getElementById("modalWorkshopDesc").textContent = item.description;
            document.getElementById("modalArtisanDetail").textContent = item.artisan;
            document.getElementById("modalSpecialtyDetail").textContent = item.specialty;
            document.getElementById("modalScheduleDetail").textContent = item.schedule;
            document.getElementById("modalCoordsDetail").textContent = `${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}`;
            document.getElementById("modalRouteExternalLink").href = `https://www.openstreetmap.org/?mlat=${item.lat}&mlon=${item.lng}#map=14/${item.lat}/${item.lng}`;
            modal.classList.add("open");
        }

        window.openWorkshopById = function (workshopId) {
            for (const cat of DATA_BORDADORAS_YUCATAN) {
                const found = cat.items.find(i => i.id === workshopId);
                if (found) {
                    openWorkshopModal(cat, found);
                    return;
                }
            }
        };

        function closeWorkshopModal() {
            const modal = document.getElementById("workshopDetailModal");
            if (modal) modal.classList.remove("open");
        }

        function switchBasemap(key) {
            document.querySelectorAll(".basemap-btn").forEach(btn => {
                btn.classList.toggle("active", btn.getAttribute("data-basemap") === key);
            });

            if (!usingSvgFallback && map && baseLayers[key]) {
                Object.keys(baseLayers).forEach(k => {
                    if (k !== key && map.hasLayer(baseLayers[k])) {
                        map.removeLayer(baseLayers[k]);
                    }
                });
                if (!map.hasLayer(baseLayers[key])) {
                    baseLayers[key].addTo(map);
                }
                forceMapResize();
            }
        }

        function initLeafletMap() {
            if (typeof window.L !== "undefined" && typeof window.L.map === "function") {
                const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 19,
                    attribution: "&copy; OpenStreetMap contributors"
                });

                const claro = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
                    maxZoom: 19,
                    attribution: "&copy; OpenStreetMap &copy; CARTO"
                });

                const satelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
                    maxZoom: 19,
                    attribution: "&copy; Esri"
                });

                let tileErrs = 0;
                let tileOk = 0;
                osm.on("tileerror", () => {
                    tileErrs += 1;
                    if (tileErrs >= 5 && tileOk === 0) {
                        usingSvgFallback = true;
                        document.getElementById("svgFallbackLayer").classList.add("active");
                        renderPinsOnMap(false);
                    }
                });
                osm.on("tileload", () => {
                    tileOk += 1;
                });

                baseLayers = { osm, claro, satelite };
                map = L.map("map", {
                    center: YUCATAN_CENTER,
                    zoom: YUCATAN_ZOOM,
                    zoomControl: true,
                    attributionControl: false,
                    layers: [osm]
                });

                pinsLayerGroup = L.layerGroup().addTo(map);

                forceMapResize();
                setTimeout(forceMapResize, 150);
                setTimeout(forceMapResize, 500);
                setTimeout(forceMapResize, 1200);

                window.addEventListener("resize", forceMapResize);
                const mapNode = document.getElementById("map");
                if (window.ResizeObserver && mapNode) {
                    const ro = new ResizeObserver(() => forceMapResize());
                    ro.observe(mapNode);
                }
            } else {
                usingSvgFallback = true;
                document.getElementById("svgFallbackLayer").classList.add("active");
            }
        }

        function bindEventListeners() {
            const headerToggle = document.getElementById("directoryHeaderToggle");
            const bodyEl = document.getElementById("directoryBody");
            const caretEl = document.getElementById("directoryHeaderCaret");

            const toggleDirectory = () => {
                isDirectoryExpanded = !isDirectoryExpanded;
                bodyEl.classList.toggle("collapsed", !isDirectoryExpanded);
                headerToggle.classList.toggle("collapsed", !isDirectoryExpanded);
                headerToggle.setAttribute("aria-expanded", String(isDirectoryExpanded));
                caretEl.innerHTML = isDirectoryExpanded ? "&#9660;" : "&#9654;";
                setTimeout(forceMapResize, 120);
            };

            headerToggle.addEventListener("click", toggleDirectory);
            headerToggle.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    toggleDirectory();
                }
            });

            document.getElementById("closeDetachedSubmenuBtn").addEventListener("click", () => {
                isSubmenuOpen = false;
                renderDetachedSubmenu();
                setTimeout(forceMapResize, 190);
            });

            document.getElementById("directorySearchInput").addEventListener("input", (e) => {
                searchQuery = e.target.value;
                renderCategoriesRows();
                renderDetachedSubmenu();
                renderPinsOnMap(Boolean(searchQuery.trim()));
            });

            document.querySelectorAll(".basemap-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    switchBasemap(btn.getAttribute("data-basemap"));
                });
            });

            document.getElementById("centerYucatanBtn").addEventListener("click", () => {
                activeCategoryId = null;
                isSubmenuOpen = false;
                searchQuery = "";
                document.getElementById("directorySearchInput").value = "";
                if (!usingSvgFallback && map) {
                    map.closePopup();
                    map.setView(YUCATAN_CENTER, YUCATAN_ZOOM, { animate: true });
                    forceMapResize();
                }
                renderCategoriesRows();
                renderDetachedSubmenu();
                renderPinsOnMap(false);
                showToastMessage("Centrado en Yucatán");
            });

            document.getElementById("closeWorkshopModalBtn").addEventListener("click", closeWorkshopModal);
            document.getElementById("workshopDetailModal").addEventListener("click", (e) => {
                if (e.target.id === "workshopDetailModal") closeWorkshopModal();
            });
            document.getElementById("modalCenterPinBtn").addEventListener("click", () => {
                if (selectedWorkshopPair && !usingSvgFallback && map) {
                    const { item } = selectedWorkshopPair;
                    closeWorkshopModal();
                    map.setView([item.lat, item.lng], 13, { animate: true });
                    const m = pinMarkersById[item.id];
                    if (m) setTimeout(() => m.openPopup(), 200);
                }
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            bindEventListeners();
            renderCategoriesRows();
            renderDetachedSubmenu();

            ensureLeafletReady(() => {
                initLeafletMap();
                renderPinsOnMap(false);
            });
        });
    </script>
</body>
</html>
